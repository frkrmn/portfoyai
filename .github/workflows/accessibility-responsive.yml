name: Accessibility and responsive regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production fixture
        run: |
          node server/performance-fixture-server.mjs > /tmp/a11y-fixture.log 2>&1 &
          echo $! > /tmp/a11y-fixture.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4178/api/public-sites/a11y-clean-modern >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/a11y-fixture.log
          exit 1
      - name: Run WCAG, keyboard and viewport regressions
        run: npm run test:a11y-responsive
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-responsive-report
          path: reports/accessibility/
          if-no-files-found: error
          retention-days: 14
      - name: Stop production fixture
        if: always()
        run: kill "$(cat /tmp/a11y-fixture.pid)" 2>/dev/null || true
